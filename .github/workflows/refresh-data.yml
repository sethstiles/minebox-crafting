name: Refresh data

# Rebuilds index.html from the live Minebox API once a day and pushes it if the
# data changed. GitHub Pages (legacy, branch = main) auto-rebuilds on the push.
# PYTHONHASHSEED is pinned so the build is byte-for-byte reproducible -> the
# commit step only fires when the underlying data actually changed.

on:
  schedule:
    - cron: '17 9 * * *'   # daily, ~09:17 UTC
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch API data (recipes, items, harvestables, sets, attributes, relics)
        run: python fetch_data.py

      - name: Fetch vanilla icon fallbacks
        run: python fetch_vanilla_icons.py

      - name: Build index.html
        run: python build.py

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No data changes; index.html unchanged. Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-refresh data ($(date -u +%Y-%m-%d))"
          git push
